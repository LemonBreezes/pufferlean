# Default hyperparameters for the Lean `puffer` trainer.
#
# Mirrors PufferLib's config/default.ini layering: these values are the base, overlaid
# by config/ocean/<env>.ini (per-env), then by CLI flags (--train.learning-rate ...).
# Section headers are cosmetic — keys flatten to the same leaf names the CLI uses, so a
# config entry and a `--flag` are interchangeable.

[train]
# Base hypers stay TOY-TUNED (PufferLib's values in comments) so the smoke tests converge fast;
# per-env config/ocean/*.ini + CLI flags override, exactly like PufferLib's config layering.
total_timesteps = 300000
learning_rate   = 0.015     # PufferLib config/default.ini (was 0.03: toy-tuned)
seed            = 42
epochs          = 4
gamma           = 0.995     # PufferLib config/default.ini (was 0.99: toy-tuned)
gae_lambda      = 0.90      # PufferLib config/default.ini (was 0.95: toy-tuned)
vf_coef         = 2.0       # PufferLib config/default.ini (was 0.5: toy-tuned)
ent_coef        = 0.001     # PufferLib config/default.ini (was 0.01: toy-tuned)
clip_coef       = 0.2
max_grad_norm   = 1.5       # PufferLib config/default.ini (was 0.5: toy-tuned)

# PufferLib parity optimizer/replay hypers (torch_pufferl.py) — EXACT PufferLib defaults,
# threaded into train-ffi (Muon momentum, value-loss clip, prioritized replay, cosine-LR floor).
beta1           = 0.95           # Muon momentum
eps             = 1e-12          # Muon Newton–Schulz norm floor (PufferLib config/default.ini)
vf_clip_coef    = 0.2            # value-loss clipping
prio_alpha      = 0.8            # prioritized-replay exponent
prio_beta0      = 0.2            # prioritized-replay IS-anneal start
min_lr_ratio    = 0.0            # cosine-LR floor ratio

# Keys PufferLib's config/default.ini sets that this base was silently missing — without them the
# CLI's own defaults applied instead, so `puffer train <env>` ran DIFFERENT hyperparameters than
# PufferLib's `puffer train <env>` for every env whose per-env ini does not override them. The
# worst was horizon: our CLI default was 128 against their base 64, i.e. double the rollout length.
horizon         = 64             # PufferLib config/default.ini:85
# PufferLib's [vec] base. Envs whose own ini omits total_agents inherit THIS upstream; ours had no
# base value, so they fell back to the CLI's smoke-test default of 8 — whisker_racer ran a batch of
# 8 (23437 updates, 0.09M SPS, 100x below the sweep median, and a harness timeout) where PufferLib
# runs 4096.
total_agents    = 4096
replay_ratio    = 1.0
anneal_lr       = 1
beta2           = 0.999
vtrace_rho_clip = 1.0
vtrace_c_clip   = 1.0
minibatch_size  = 8192

[policy]
hidden_size = 128                # PufferLib config/default.ini [policy] (was 16: toy-tuned)
num_layers  = 4                  # PufferLib [policy] num_layers

[eval]
eval_episodes = 100
log_interval  = 200

# Hyperparameter-SWEEP config (mirrors PufferLib's config/default.ini [sweep] block). Read by
# `puffer sweep <env>` / `puffer paretosweep <env>` (Puffer/RL/Sweep.lean). The [sweep] scalars pick the
# optimizer + objective; each [sweep.<group>.<param>] is a search Space (distribution / min / max / scale).
# match_* keys are omitted (match-mode is out of scope, and they break pufferlib.sweep's Hyperparameters).
[sweep]
method = Protein
metric = score
metric_distribution = linear
goal = maximize
max_suggestion_cost = 3600
max_runs = 1200
gpus = 0
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1e11
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 32
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.vec.num_buffers]
distribution = uniform
min = 1
max = 8
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 1024
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 0.1
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00001
max = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.8
max = 0.9999
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.2
max = 0.995
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.25
max = 4.0
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.01
max = 1.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 5.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.1
max = 5.0
scale = auto

[sweep.train.beta1]
distribution = logit_normal
min = 0.5
max = 0.999
scale = auto

[sweep.train.beta2]
distribution = logit_normal
min = 0.9
max = 0.99999
scale = auto

[sweep.train.eps]
distribution = log_normal
min = 1e-14
max = 1e-4
scale = auto

[sweep.train.prio_alpha]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.train.prio_beta0]
distribution = uniform
min = 0.0
max = 1.0
scale = auto
